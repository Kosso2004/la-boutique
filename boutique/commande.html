<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>La Boutique — Commande</title><link rel="stylesheet" href="css/style.css"></head><body><header class="header"><a class="logo" href="index.html">La Boutique<span>.</span></a><nav><a href="index.html">Accueil</a><a href="boutique.html">La boutique</a><a href="suivi-commande.html">Suivi commande</a></nav><div class="header-actions"><a href="panier.html">Panier <b class="cart-count">0</b></a></div></header><main class="page narrow"><p class="eyebrow">DERNIÈRE ÉTAPE</p><h1>Finaliser votre commande.</h1><div class="checkout-grid"><form id="checkout-form" class="panel"><h3>Vos coordonnées</h3><div class="form-row"><label>Prénom<input required name="first" placeholder="Votre prénom"></label><label>Nom<input required name="last" placeholder="Votre nom"></label></div><label>Adresse e-mail<input required type="email" name="email" placeholder="vous@exemple.com"></label><label>Téléphone<input required name="phone" placeholder="+223 ..."></label><h3>Adresse de livraison</h3><label>Adresse<input required name="address" placeholder="Rue, quartier"></label><div class="form-row"><label>Ville<input required name="city" value="Bamako"></label><label>Code postal<input name="zip" placeholder="Facultatif"></label></div><label>Mode de paiement<select name="payment"><option>Paiement à la livraison</option><option>Mobile Money (à confirmer)</option></select></label><button class="btn full" type="submit">Confirmer la commande</button><p class="muted tiny">Votre commande sera enregistrée dans notre système. Le paiement sera confirmé avec vous selon le mode choisi.</p></form><aside class="panel" id="checkout-summary"></aside></div></main><footer><a class="logo" href="index.html">La Boutique<span>.</span></a><small>© 2026 La Boutique.</small></footer><script src="js/app.js"></script></body></html>
