
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - La Boutique</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f1eb;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px #0002;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #777;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #29251f;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #message {
            color: #c0392b;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>La Boutique</h2>
        <p>Espace administrateur</p>

        <form id="adminLoginForm">
            <input type="email" id="email"
                   placeholder="Adresse e-mail" required>

            <input type="password" id="password"
                   placeholder="Mot de passe" required>

            <button type="submit">Se connecter</button>
        </form>

        <p id="message"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/admin.js"></script>

</body>
</html>
